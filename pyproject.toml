[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "prooflab"
version = "0.2.0"
description = "Learning to search for Lean-verified mathematical proofs"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "networkx>=3.4,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "httpx>=0.28,<1", "playwright>=1.51,<2", "matplotlib>=3.10,<4"]

[project.scripts]
prooflab = "prooflab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prooflab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: executes real Lean", "browser: runs Chromium"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["prooflab"]
